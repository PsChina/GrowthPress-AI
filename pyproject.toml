[project]
name = "GrowthPress-AI"
version = "0.2.0"
description = "GrowthPress 工具腰带 — 给 claude CLI 当数字员工的发布/审批/通知/状态机后台. 大脑是 Claude 主对话, GrowthPress 不内置 LLM."
requires-python = ">=3.11"
dependencies = [
    # 核心
    "httpx[socks]>=0.27",
    "aiofiles>=23",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    # 邮件 (approver 发 / mailbox 收)
    "aiosmtplib>=3.0",
    "aioimaplib>=1.1",
    # 调度 (orchestrator daemon TaskGroup)
    "apscheduler>=3.10",
    # publisher 插件 — 通过 entry_points 注册. 本地 plugins/ 路径见 [tool.uv.sources]
    "xhs-publisher",
]

[tool.uv.sources]
xhs-publisher = { path = "plugins/xhs-publisher", editable = true }

# 渠道插件: 各平台实现 growthpress.publisher.Publisher 协议, 通过 entry_point 注册
# 当前装法 (xhs-publisher 是私有仓, 不在 PyPI):
#   uv pip install -e ../xhs-publisher
# 将来若发 PyPI 或定 git URL, 在此启用 [project.optional-dependencies]:
#   [project.optional-dependencies]
#   xhs    = ["xhs-publisher @ git+ssh://git@github.com/PsChina/xhs-publisher.git"]
#   douyin = ["dy-publisher>=0.1"]
#   weibo  = ["wb-publisher>=0.1"]
#   bili   = ["bili-publisher>=0.1"]
#   wechat = ["wx-publisher>=0.1"]
#   all    = [...]

[project.scripts]
growthpress       = "growthpress.orchestrator:cli_main"
growthpress-setup = "growthpress.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["growthpress"]
