[project]
name = "GrowthPress-AI"
version = "0.1.0"
description = "GrowthPress AI — 内容自动化数字员工: Scout+Writer → Reviewer → Approver → Publisher → Mailbox"
requires-python = ">=3.11"
dependencies = [
    # 核心
    "httpx[socks]>=0.27",
    "aiofiles>=23",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    # LLM (m0 core: 统一 client + provider switch)
    "anthropic>=0.40",
    "openai>=1.40",
    # 邮件 (m3/m4/m5)
    "aiosmtplib>=3.0",
    "aioimaplib>=1.1",
    # 调度 (orchestrator)
    "apscheduler>=3.10",
]

# 渠道插件: 各平台实现 growthpress.publisher.Publisher 协议, 通过 entry_point 注册
# 当前装法 (xhs-publisher 是私有仓, 不在 PyPI):
#   uv pip install -e ../xhs-publisher
# 将来若发 PyPI 或定 git URL, 在此启用 [project.optional-dependencies]:
#   [project.optional-dependencies]
#   xhs    = ["xhs-publisher @ git+ssh://git@github.com/PsChina/xhs-publisher.git"]
#   douyin = ["dy-publisher>=0.1"]
#   weibo  = ["wb-publisher>=0.1"]
#   bili   = ["bili-publisher>=0.1"]
#   wechat = ["wx-publisher>=0.1"]
#   all    = [...]

[project.scripts]
growthpress       = "growthpress.orchestrator:cli_main"
growthpress-setup = "growthpress.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["growthpress"]
