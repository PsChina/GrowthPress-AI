[project]
name = "growthpress-ai"
version = "0.1.0"
description = "GrowthPress AI — 内容自动化数字员工: Scout+Writer → Reviewer → Approver → Publisher → Mailbox"
requires-python = ">=3.11"
dependencies = [
    # 核心
    "httpx>=0.27",
    "aiofiles>=23",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    # LLM (m0 core: 统一 client + provider switch)
    "anthropic>=0.40",
    "openai>=1.40",
    # 邮件 (m3/m4/m5)
    "aiosmtplib>=3.0",
    "aioimaplib>=1.1",
    # 调度 (orchestrator)
    "apscheduler>=3.10",
